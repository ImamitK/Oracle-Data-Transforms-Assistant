[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odt-assistant"
version = "0.1.0"
description = "A learning project for an Oracle Data Transforms documentation assistant"
requires-python = ">=3.11"
dependencies = [
    "boto3[crt]>=1.41.0,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "beautifulsoup4>=4.12,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
